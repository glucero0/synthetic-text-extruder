name: Android APK

on:
  push:
    branches: [main, convert-to-android]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to public GitHub Releases"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag (e.g. v0.2.0-android) when publishing"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12 (for Chaquopy)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode optional Android signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        working-directory: android
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.setup-python.outputs.python-path }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          export CHAQUOPY_BUILD_PYTHON="$(which python3)"
          gradle :app:assembleRelease --no-daemon

      - name: Locate built APK
        id: apk
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No release APK found" >&2
            exit 1
          fi
          OUT_APK="android/app/build/outputs/apk/release/synthetic-text-extruder-android.apk"
          cp "$APK_FILE" "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-text-extruder-android-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ "$TAG" = "main" ] || [ "$TAG" = "convert-to-android" ]; then
            TAG="v0.1.${GITHUB_RUN_NUMBER}-android"
          fi
          gh release create "$TAG" "${{ steps.apk.outputs.apk_path }}" \
            --title "Synthetic Text Extruder Android ($TAG)" \
            --notes "Automated Android APK build (Hybrid Python 3.12 + Foldable Adaptive UI, Pillow 13.0.0, Dual Google OAuth JSON import). No API keys or OAuth tokens are bundled." \
            --latest || gh release upload "$TAG" "${{ steps.apk.outputs.apk_path }}" --clobber
