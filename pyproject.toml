[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-text-extruder"
version = "0.1.0"
description = "Single-window general AI studio for text, images, video, and music"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Synthetic Text Extruder contributors" }]
keywords = ["ai", "studio", "documentation", "gemini", "lyria"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "pywebview>=5.3",
  "PyYAML>=6.0",
  "google-genai>=1.0",
  "youtube-transcript-api>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
synthetic-text-extruder = "synthetic_text_extruder.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_text_extruder*"]

[tool.setuptools.package-data]
synthetic_text_extruder = ["ui/**/*", "data/**/*", "prompts/**/*"]
