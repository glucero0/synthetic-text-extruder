# Example configuration — copy to config.yaml or edit via Control Panel.
# config.yaml is gitignored (may contain your API keys).

backend:
  provider: gemini

gemini:
  # Four Gemini slots — Studio picks by prompt intent (cheapest defaults)
  text_model: gemini-2.5-flash
  image_model: gemini-2.5-flash-image
  video_model: veo-2.0-generate-001
  audio_model: lyria-3-clip-preview
  api_key: null
  google_search: true
  # Pass 1: search & extract with sourceSnippets; Pass 2: verify at temperature 0
  two_pass_verify: true
  # Local file tools via Gemini function calling (can combine with google_search)
  use_tools: false
  temperature: 0.0

prompt:
  # Control Panel → Extra system instructions (appended to generation prompts).
  # Does not choose report vs video vs extract — that is the Studio policy classifier.
  extra_instructions: ""

ui:
  sound_enabled: true
  crt_enabled: false
  ui_scale: 1.0  # Display scaling (DPI). Desktop stays screen-sized; fonts and chrome grow together.
  # App chrome font (Control Panel → Display). Default Inter is more readable than Retro Pixel.
  ui_font: inter
  ui_font_size: 13  # UI font size in px (11–22). Settings → Appearance.
  app_theme: light  # light | dark
  window_width: 1280
  window_height: 800
  studio_basis_width: 280  # Creation Studio Media basis pane width (px)
  lineage_pane_width: 360  # Lineage right-hand viewer pane width (px)
  title: "Synthetic Text Extruder"

paths:
  archives: archives.json
  # Relative "media" is the project library folder. Control Panel can set an absolute folder.
  media: media
  # Default Save As folder. Dialogs always open here (not the last-used folder).
  # GENERATE does not write here.
  exports: exports
  prompts: prompts.json

google_workspace:
  # OAuth client JSON from Google Cloud Console (Desktop application type)
  # One token covers Gmail, Drive, Docs, Calendar, and Tasks after Connect Google Workspace.
  credentials_path: null
  token_path: .synthetic-text-extruder/google_workspace_token.json

# Video Editor (Viewer → Edit on a video) requires ffmpeg + ffprobe on PATH
# (or a common Windows install location). Install from https://ffmpeg.org/
